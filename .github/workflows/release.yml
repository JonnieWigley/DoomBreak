name: Release APK

# Push a tag like v0.3.0 to build the Android APK and publish it as a GitHub release.
# The tag must match "version" in app.json (bump android.versionCode too).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app.json version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app.json version $APP_VERSION"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      # Signed with DoomBreak's own key, stored as repository secrets (see plugins/with-release-signing.js).
      # Refuses to build without it, so a release is never signed with the public debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOOMBREAK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DOOMBREAK_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doombreak-release.jks"

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_DOOMBREAK_STORE_FILE: ${{ runner.temp }}/doombreak-release.jks
          ORG_GRADLE_PROJECT_DOOMBREAK_STORE_PASSWORD: ${{ secrets.DOOMBREAK_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DOOMBREAK_KEY_ALIAS: ${{ secrets.DOOMBREAK_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DOOMBREAK_KEY_PASSWORD: ${{ secrets.DOOMBREAK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - run: rm -f "$RUNNER_TEMP/doombreak-release.jks"

      - run: mv android/app/build/outputs/apk/release/app-release.apk "DoomBreak-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: DoomBreak-${{ github.ref_name }}.apk
          generate_release_notes: true
