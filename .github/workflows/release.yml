name: Release APK

# Push a tag like v0.3.0 to build the Android APK and publish it as a GitHub release.
# The tag must match "version" in app.json (bump android.versionCode too).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app.json version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app.json version $APP_VERSION"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      # Signed with the Expo template's debug.keystore, the same key as earlier releases,
      # so new APKs install over old ones.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - run: mv android/app/build/outputs/apk/release/app-release.apk "DoomBreak-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: DoomBreak-${{ github.ref_name }}.apk
          generate_release_notes: true
